version: '3.8'

services:
  ids-prod:
    build: .
    container_name: ids_monitor_prod
    # Host network mode is required for a real IDS to monitor the actual host machine
    network_mode: "host"
    pid: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - default
      - prod

  ids-dev:
    build: .
    container_name: ids_monitor_dev
    network_mode: "host"
    pid: "host"
    # Privileged is required to write iptables rules on the host firewall in some dev envs
    privileged: true
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
